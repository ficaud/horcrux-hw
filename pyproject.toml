[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horcrux-mkdocs-plugins"
version = "0.1.0"
description = "Custom MkDocs plugins for the Horcrux Hardware documentation"
requires-python = ">=3.8"

[project.entry-points."mkdocs.plugins"]
version_plugin = "plugins.version_plugin:VersionPlugin"

[tool.setuptools]
packages = ["plugins"]

